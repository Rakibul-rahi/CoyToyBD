<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 940" width="1680" height="940">
  <defs>
    <filter id="neonGlowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
      </feMerge>
    </filter>
    <filter id="neonGlowMed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
      </feMerge>
    </filter>
    <filter id="neonGlowTight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1680" height="940" fill="#15090f"/>
  <ellipse cx="840" cy="460" rx="760" ry="380" fill="#2a0f22"/>

  <!-- ============ CAR GROUP ============ -->
  <g id="car" fill="none" stroke="#ff2fd6" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== WIDE OUTER GLOW PASS ===== -->
    <g stroke-width="14" opacity="0.55" filter="url(#neonGlowSoft)">
      <use href="#topLine"/>
      <use href="#frontBumper"/>
      <use href="#rearBumper"/>
      <use href="#rockerLine"/>
      <use href="#beltLine"/>
      <circle cx="430" cy="555" r="92"/>
      <circle cx="1185" cy="555" r="92"/>
    </g>

    <!-- ===== MID GLOW PASS ===== -->
    <g stroke-width="7" opacity="0.75" filter="url(#neonGlowMed)">
      <use href="#topLine"/>
      <use href="#frontBumper"/>
      <use href="#rearBumper"/>
      <use href="#rockerLine"/>
      <use href="#beltLine"/>
      <use href="#doorSeam1"/>
      <use href="#doorSeam2"/>
      <use href="#windshield"/>
      <use href="#frontQuarterWindow"/>
      <use href="#rearWindow"/>
      <use href="#mirror"/>
      <use href="#doorHandle1"/>
      <use href="#doorHandle2"/>
      <use href="#headlightDetail"/>
      <use href="#frontVent1"/>
      <use href="#frontVent2"/>
      <use href="#taillightDetail"/>
      <use href="#taillightSlash1"/>
      <use href="#taillightSlash2"/>
      <circle cx="430" cy="555" r="92"/>
      <circle cx="430" cy="555" r="58"/>
      <circle cx="1185" cy="555" r="92"/>
      <circle cx="1185" cy="555" r="58"/>
    </g>

    <!-- ===== CRISP CORE LINES ===== -->
    <g stroke="#ffd6f5" stroke-width="3.2" filter="url(#neonGlowTight)">
      <use href="#topLine"/>
      <use href="#frontBumper"/>
      <use href="#rearBumper"/>
      <use href="#rockerLine"/>
      <use href="#beltLine"/>
      <use href="#doorSeam1"/>
      <use href="#doorSeam2"/>
      <use href="#windshield"/>
      <use href="#frontQuarterWindow"/>
      <use href="#rearWindow"/>
      <use href="#mirror"/>
      <use href="#doorHandle1"/>
      <use href="#doorHandle2"/>
      <use href="#headlightDetail"/>
      <use href="#frontVent1"/>
      <use href="#frontVent2"/>
      <use href="#taillightDetail"/>
      <use href="#taillightSlash1"/>
      <use href="#taillightSlash2"/>
      <circle cx="430" cy="555" r="92"/>
      <circle cx="430" cy="555" r="58"/>
      <circle cx="1185" cy="555" r="92"/>
      <circle cx="1185" cy="555" r="58"/>
    </g>

    <!-- ===== WHITE-HOT FILAMENT CORE ===== -->
    <g stroke="#ffffff" stroke-width="1.3" opacity="0.9">
      <use href="#topLine"/>
      <use href="#frontBumper"/>
      <use href="#rearBumper"/>
      <use href="#rockerLine"/>
      <circle cx="430" cy="555" r="92"/>
      <circle cx="430" cy="555" r="58"/>
      <circle cx="1185" cy="555" r="92"/>
      <circle cx="1185" cy="555" r="58"/>
    </g>
  </g>

  <!-- ============ PATH DEFINITIONS ============ -->
  <defs>
    <!-- Hood front, up over roof, down the rear, to rear bumper top -->
    <path id="topLine" d="M205,432
             C212,400 240,372 285,355
             C300,328 322,306 358,294
             C430,268 535,245 650,236
             C762,227 895,229 1000,252
             C1090,272 1170,298 1228,328
             C1278,350 1316,370 1338,396
             C1370,404 1396,418 1408,438
             C1430,446 1446,460 1446,478
             C1446,498 1426,512 1400,516
             C1368,522 1328,526 1288,532"/>

    <!-- Front bumper rounding under headlight -->
    <path id="frontBumper" d="M168,460
             C160,484 162,508 182,524
             C196,534 210,536 222,533"/>

    <!-- Rocker / sill line connecting front to rear under the doors -->
    <path id="rockerLine" d="M222,533 L295,536 L1075,545"/>

    <!-- Rear bumper rounding -->
    <path id="rearBumper" d="M1288,532
             C1280,548 1264,562 1238,568
             C1195,578 1138,580 1075,545"/>

    <path id="beltLine" d="M358,300 L1175,300"/>

    <path id="doorSeam1" d="M770,255 L758,520"/>
    <path id="doorSeam2" d="M796,250 L796,300"/>

    <path id="windshield" d="M462,298
             C480,266 522,243 582,233
             C628,226 690,224 750,225"/>

    <path id="frontQuarterWindow" d="M462,298 L530,298"/>

    <path id="rearWindow" d="M1000,252
             C1052,265 1102,286 1148,310
             C1160,317 1158,300 1148,298
             L1005,298"/>

    <path id="mirror" d="M598,298
             C590,282 593,267 608,260
             C622,254 634,263 631,277
             C628,288 614,296 598,298 Z"/>

    <path id="doorHandle1" d="M795,385 L855,379"/>
    <path id="doorHandle2" d="M1090,379 L1142,373"/>

    <path id="headlightDetail" d="M178,428
             C204,415 236,409 260,415
             C272,419 271,428 258,433
             C232,441 202,440 182,432 Z"/>

    <path id="frontVent1" d="M168,460 C184,455 200,456 212,462"/>
    <path id="frontVent2" d="M168,472 L204,470"/>

    <path id="taillightDetail" d="M1330,392
             C1348,396 1360,406 1357,415
             C1355,424 1340,427 1327,423
             C1316,419 1316,408 1322,400 Z"/>
    <path id="taillightSlash1" d="M1310,430 L1348,426"/>
    <path id="taillightSlash2" d="M1300,442 L1330,438"/>
  </defs>
</svg>